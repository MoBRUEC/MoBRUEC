# jekyll-seo-tag appends this to every page title as "Page | site.title".
# The old value added a 44-character suffix, pushing page titles to 112-152 chars
# and the name itself past Google's ~60-char truncation on all 51 pages. The
# visible header renders its own <h1>, so this affects the <title> tag only.
title: "Mohammed Brueckner"
lang: en
description: "Enterprise architect and author in Munich: PlantUML and ArchiMate guides, platform economics, MLOps with Databricks, and practical AI adoption — hands-on, no hype."

# Use your custom domain here
url: "https://mohammed-brueckner.com"
baseurl: ""  # leave empty for root of the domain
theme: jekyll-theme-architect

# Markdown processing - ADDED FOR MERMAID SUPPORT
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  parse_block_html: true

# Social Links
social_links:
  - name: LinkedIn
    url: "https://www.linkedin.com/in/mbrueckner/"
    icon: "fab fa-linkedin"
  - name: Spotify
    url: "https://open.spotify.com/show/0LUvemwzThUrQR8f5UmFRW?si=-X6NRDacSeCOvHizduAUzw"
    icon: "fab fa-spotify"
  - name: Medium
    url: "https://medium.com/@mohammedbrueckner"
    icon: "fab fa-medium"

# Ensure Jekyll includes what is needed
include:
  - "**/*.jpg"
  - "**/*.png"
  - "**/*.json"

# Default front matter: every page gets an og:image unless it sets its own
defaults:
  - scope:
      path: ""
    values:
      image: /platform-economies/platform-economies-cover-lowres.jpg
